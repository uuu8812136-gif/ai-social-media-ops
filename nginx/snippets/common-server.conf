# ── 安全响应头 ──
# CORS 由后端 FastAPI 根据 CORS_ORIGINS 返回；此处不写 Access-Control-*，避免生产反代覆盖白名单。
include /etc/nginx/snippets/security-headers.conf;
# The inner static-file Nginx also protects direct local access. Hide its
# copies at the public proxy so browsers receive one authoritative header set.
proxy_hide_header X-Frame-Options;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header X-XSS-Protection;
proxy_hide_header Permissions-Policy;
proxy_hide_header Content-Security-Policy;
# 生产可启用 HSTS（需先上 HTTPS）
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# ── 健康检查（供容器健康检查与负载均衡探测）──
location ^~ /health {
    proxy_pass http://backend;
    proxy_set_header Host $host;
    access_log off;
}

# ── API 接口 ──
location /api/ {
    limit_req zone=api burst=60 nodelay;
    client_max_body_size 2m;
    proxy_pass http://backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
}

# 站内 noVNC 已停用：登录/发布验证只显示 Mac 宿主真实 Chrome。
# 对旧版浏览器缓存的 iframe 请求明确返回 Gone，不再代理远程桌面。
location ^~ /vnc/ { return 410; }
location ^~ /worker-vnc/ { return 410; }

# ── 登录/注册/刷新 token：单独更严格限流 ──
location ~ ^/api/v1/auth/(login|register|refresh)$ {
    limit_req zone=auth burst=10 nodelay;
    proxy_pass http://backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# ── 文件上传：单独限流 ──
location ~ ^/api/v1/assets/upload$ {
    limit_req zone=upload burst=20 nodelay;
    proxy_pass http://backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 50m;
    proxy_read_timeout 120s;
}

# ── 禁止对外暴露 /docs /redoc /openapi.json（生产安全）──
location = /docs { return 404; }
location = /redoc { return 404; }
location = /openapi.json { return 404; }

# ── 前端静态资源（Vite 打包产物，强缓存）──
# 业务路由 /assets 与 Vite 静态目录同名，必须精确返回 SPA 入口，
# 否则 nginx 会将其重定向到 /assets/ 并进入静态目录。
location = /assets {
    proxy_pass http://frontend/index.html;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Private MinIO objects are exposed only through short-lived signed URLs.
location ^~ /storage/ {
    proxy_pass http://minio:9000/;
    proxy_set_header Host minio:9000;
    proxy_buffering off;
    proxy_request_buffering off;
}

location /assets/ {
    proxy_pass http://frontend;
    proxy_set_header Host $host;
    expires 30d;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/snippets/security-headers.conf;
    access_log off;
}

location = /index.html {
    proxy_pass http://frontend/index.html;
    proxy_set_header Host $host;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    include /etc/nginx/snippets/security-headers.conf;
}

# ── 前端 SPA 入口 ──
location / {
    proxy_pass http://frontend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    proxy_intercept_errors on;
    error_page 404 = /index.html;
}
