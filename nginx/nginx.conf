events {
    worker_connections 1024;
}

http {
    # ── 基础配置 ──
    client_max_body_size 50m;        # 与后端上传限制保持一致
    server_tokens off;                # 隐藏 nginx 版本号
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # ── MIME ──
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ── 日志格式 ──
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                    'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time"';
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # ── gzip 压缩 ──
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml application/manifest+json;

    # ── 限流 ──
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=upload:10m rate=10r/m;
    limit_req_status 429;

    # Docker 服务容器重建后 IP 会变化。启用运行时 DNS 解析，避免 Nginx
    # 继续缓存旧 IP 而让网页、API 或 noVNC 长时间返回 502。
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream backend {
        zone backend_upstream 64k;
        server backend:8000 resolve;
        keepalive 32;
    }

    upstream frontend {
        zone frontend_upstream 64k;
        server frontend:80 resolve;
        keepalive 16;
    }

    # ── HTTP → HTTPS 跳转（生产开启，本地开发用 80）──
    server {
        listen 80;
        server_name _;
        # 生产环境取消下行注释启用跳转
        # return 301 https://$host$request_uri;

        include /etc/nginx/snippets/common-server.conf;
    }

    # ── HTTPS（生产取消注释并挂载证书）──
    # server {
    #     listen 443 ssl http2;
    #     server_name your-domain.com;
    #
    #     ssl_certificate /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5;
    #     ssl_prefer_server_ciphers on;
    #     ssl_session_cache shared:SSL:10m;
    #     ssl_session_timeout 10m;
    #
    #     include /etc/nginx/snippets/common-server.conf;
    # }
}
